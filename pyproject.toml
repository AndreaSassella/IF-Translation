[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "translation-chains"
version = "0.1.0"
description = "Research scaffold for studying instruction-following degradation under repeated translation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
translation-chains = "translation_chains.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
